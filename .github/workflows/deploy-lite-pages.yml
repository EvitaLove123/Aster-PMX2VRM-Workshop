name: Deploy Aster PMX2VRM Lite to GitHub Pages

on:
  push:
    branches: [lite]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aster-pmx2vrm-lite-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lite branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare lightweight site
        run: |
          mkdir -p _site/src/vrm
          cp index.html _site/index.html
          cp src/vrm/three-vrm0-exporter.js _site/src/vrm/
          cp src/vrm/three-vrm-runtime.js _site/src/vrm/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
