name: Build and deploy Aster UniVRM WebGL runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aster-univrm-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Unity WebGL with official UniVRM
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: univrm-runtime
          unityVersion: 2022.3.0f1
          targetPlatform: WebGL
          buildMethod: Aster.PMX2VRM.Editor.AsterWebGLBuild.BuildWebGL
          allowDirtyBuild: true

      - name: Prepare GitHub Pages site and browser bridge
        shell: bash
        run: |
          set -euo pipefail
          test -f univrm-runtime/Build/WebGL/index.html
          mkdir -p site/univrm-runtime/Build/WebGL
          touch site/.nojekyll
          cp index.html site/index.html
          cp -R univrm-runtime/Build/WebGL/. site/univrm-runtime/Build/WebGL/
          python3 - <<'PY'
          from pathlib import Path
          page = Path("site/univrm-runtime/Build/WebGL/index.html")
          html = page.read_text(encoding="utf-8")
          marker = ".then((unityInstance) => {"
          if marker not in html:
              raise SystemExit("Unity WebGL template callback not found; bridge injection stopped.")
          html = html.replace(marker, marker + "\n          window.unityInstance = unityInstance;", 1)
          bridge = """
          <script>
          window.addEventListener('message', function (event) {
            if (event.source !== window.parent || !event.data || event.data.type !== 'aster-univrm-call') return;
            var call = event.data;
            if (!window.unityInstance) return;
            window.unityInstance.SendMessage('AsterRuntimeBridge', call.method, call.value || '');
          });
          </script>
          """
          html = html.replace("</body>", bridge + "\n</body>")
          page.write_text(html, encoding="utf-8")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
